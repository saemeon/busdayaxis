[project]
name = "busdayaxis"
dynamic = ["version"]
description = "Business day axis scale for matplotlib"
keywords = ["matplotlib", "business day", "busday", "matplotlib-scale"]
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Framework :: Matplotlib",
    "Operating System :: OS Independent",
]
readme = "README.md"
license = "MIT"
authors = [
    { name = "Simon Niederberger", email = "s.niederberger@hotmail.com" },
]
maintainers = [
    { name = "Simon Niederberger", email = "s.niederberger@hotmail.com" },
]
requires-python = ">=3.10"
dependencies = ["matplotlib", "numpy"]

[project.urls]
Homepage = "https://saemeon.github.io/busdayaxis/"
Repository = "https://github.com/saemeon/busdayaxis"

[dependency-groups]
test = [
    "exchange-calendars>=4.5.6",
    "pandas",
    "pandas-market-calendars>=5.2.4",
    "pytest",
    "pytest-cov",
]
doc = [
    "mkdocs",
    "mkdocs-material",
    "mkdocs-gallery",
    "mkdocstrings[python]",
    "mike",
    "pandas-market-calendars>=5.2.4",
]
dev = [
    "ruff",
    "prek",
    "ty",
    { include-group = "test" },
    { include-group = "doc" },
]

[build-system]
requires = ["setuptools>=61.0", "wheel", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
write_to = "src/busdayaxis/_version.py"
version_scheme = "post-release"
local_scheme = "no-local-version"

[tool.setuptools.dynamic]
version = { attr = "busdayaxis._version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
busdayaxis = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src/busdayaxis --cov-report=term-missing"

[tool.ty.src]
include = ["src"]

[tool.ty.rules]
unresolved-import = "warn"

[tool.ruff]
line-length = 88
target-version = "py310"
exclude = ["src/busdayaxis/_version.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E203"]
